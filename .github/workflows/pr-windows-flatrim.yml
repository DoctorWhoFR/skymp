name: PR Windows Flatrim (AE/SE)

on:
  workflow_dispatch:
  push:
    branches: [ main, ia-forge ]
    # ia-forge : le plugin d'icônes a son propre workflow (ia-forge-icons.yml), inutile de recompiler le client.
    paths-ignore:
      - 'ia-forge-icons/**'
      - '.github/workflows/ia-forge-icons.yml'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  VCPKG_FEATURE_FLAGS: 'manifests'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'true'
      - uses: ./.github/actions/pr_base
        with:
          DESCRIPTION: 'Flatrim'
          SKYRIM_VR_FLAG: OFF
          SP_NEXUS_ARTIFACT_NAME: Skyrim Platform %SP_VERSION%
          DEPLOY_BRANCH: ""
          DIST_ARTIFACT_NAME: dist
          SERVER_DIST_ARTIFACT_NAME: server-dist
          SKYMP5_PATCHES_PAT: ${{ secrets.SKYMP5_PATCHES_PAT }}
          NUGET_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ia-forge : publie le client compilé (Skyrim Platform + skymp5-client.js) dans une release publique
  # de ce fork, téléchargeable sans jeton par le serveur ia-forge, qui le distribue par son launcher.
  release:
    needs: build
    if: ${{ github.ref == 'refs/heads/ia-forge' && github.repository != 'skyrim-multiplayer/skymp' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Même version que upload-artifact (v7) ; « dist » contient déjà skymp5-client.js (déposé avant le renommage).
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Assemble client
        run: |
          set -e
          test -f dist/client/Data/Platform/Plugins/skymp5-client.js
          (cd dist/client && zip -qr "$GITHUB_WORKSPACE/skymp-client.zip" .)
          sha1sum skymp-client.zip | tee skymp-client.zip.sha1
          ls -la dist/client/Data/Platform/Plugins || true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="ia-forge-${{ github.run_number }}"
          gh release create "$tag" skymp-client.zip skymp-client.zip.sha1 \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "ia-forge client ${{ github.run_number }}" \
            --notes "Client compilé depuis ${{ github.sha }} (branche ia-forge)."
